# Keeps the toolchain patched without a stream of one-package PRs: at most one
# grouped PR a week per ecosystem. dsh-note has no runtime dependencies, so
# everything here is the dev toolchain (and the dsh peers it tests against).
version: 2
updates:
  - package-ecosystem: npm # also reads pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # vitest and @vitest/coverage-v8 must move together (the coverage
      # provider is pinned to vitest's exact version), and so should the rest.
      toolchain:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node the toolchain runs on in CI (22), not
      # the newest Node; TypeScript majors change the compiler itself. Both
      # are deliberate upgrades, not weekly chores.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
