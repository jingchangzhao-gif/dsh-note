name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # README ships Windows (run.bat) and macOS (run.command) launchers, so
        # exercise all three platforms rather than trusting path handling.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # Toolchain floor, not the package's runtime floor: tsdown needs
          # ^22.18 || >=24 and rolldown/oxlint need ^20.19 || >=22.12, so Node
          # 18/20 cannot build or lint here. engines.node >=18 covers the
          # published lib, which targets es2022 and runs on the dsh host.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm coverage
      - run: pnpm lint
